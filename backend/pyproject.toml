[project]
name = "claude-aws-devops-platform"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.4,<2", "boto3>=1.40,<2", "fastapi>=0.120,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.10,<3", "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "moto[dynamodb,secretsmanager]>=5,<6", "ruff>=0.16.6,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
