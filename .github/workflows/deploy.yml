name: Deploy environment
on:
  workflow_call:
    inputs:
      environment: {required: true, type: string}
      digest: {required: true, type: string}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.environment }}
    concurrency: {group: 'deploy-${{ inputs.environment }}', cancel-in-progress: false}
    permissions: {contents: read, id-token: write}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project: ${{ vars.PROJECT_NAME }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_runtime_boundary_arn: ${{ vars.RUNTIME_BOUNDARY_ARN }}
      TF_VAR_release_sha: ${{ github.sha }}
      TF_VAR_image_uri: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}@${{ inputs.digest }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: {terraform_version: '1.16.1', terraform_wrapper: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: frontend, path: frontend/dist}
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-deploy-${{ inputs.environment }}
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Plan, apply, verify and roll back on failure
        id: deploy
        run: bash scripts/deploy.sh
      - name: Email notification through SNS
        if: always()
        env:
          RESULT: ${{ job.status }}
          TOPIC: ${{ vars.NOTIFICATION_TOPIC_ARN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOPIC" ]; then
            echo 'Configure NOTIFICATION_TOPIC_ARN and confirm an SNS email subscription to receive deployment notifications.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws sns publish --topic-arn "$TOPIC" --subject "Claude platform $DEPLOY_ENV: $RESULT" --message "Deployment $RESULT. Details: $RUN_URL"
