name: Release
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t platform:test .
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: {image-ref: 'platform:test', format: table, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          role-session-name: build-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        if: vars.AWS_DEPLOY_ENABLED == 'true'
      - name: Publish immutable images
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        id: publish
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          BRANCH: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          environments="dev"
          if [ "$BRANCH" = main ]; then environments="staging prod"; fi
          for environment in $environments; do
            repository="$PROJECT_NAME-$environment"
            image="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$repository:$IMAGE_TAG"
            docker tag platform:test "$image"
            docker push "$image"
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  dev:
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions: {contents: read, id-token: write}
    with: {environment: dev, digest: '${{ needs.build.outputs.digest }}'}
  staging:
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions: {contents: read, id-token: write}
    with: {environment: staging, digest: '${{ needs.build.outputs.digest }}'}
  prod:
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: [build, staging]
    uses: ./.github/workflows/deploy.yml
    permissions: {contents: read, id-token: write}
    with: {environment: prod, digest: '${{ needs.build.outputs.digest }}'}
